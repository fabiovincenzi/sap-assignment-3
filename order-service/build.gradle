apply plugin: 'application'

application {
    mainClass = 'sap.shipping.order.infrastructure.OrderServiceLauncher'
}

dependencies {
    implementation project(':common')
    implementation 'io.vertx:vertx-core:4.5.7'
    implementation 'io.vertx:vertx-web:4.5.7'
    implementation 'com.google.code.gson:gson:2.11.0'

    implementation 'io.prometheus:prometheus-metrics-core:1.3.3'
    implementation 'io.prometheus:prometheus-metrics-instrumentation-jvm:1.3.3'
    implementation 'io.prometheus:prometheus-metrics-exporter-httpserver:1.3.3'

    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
    testImplementation 'io.cucumber:cucumber-java:7.29.0'
    testImplementation 'io.cucumber:cucumber-junit-platform-engine:7.29.0'
    testImplementation 'org.junit.platform:junit-platform-suite:1.10.2'
    testImplementation 'org.assertj:assertj-core:3.27.5'
}
