# -----------------------------------------
# API Gateway
# -----------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-deployment
  namespace: shipping-on-the-air
  labels:
    app: api-gateway
spec:
  # the gateway holds no state of its own, so it is the one component that can be replicated.
  # The others stay at one replica because their state lives in memory.
  replicas: 3
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: shipping-api-gateway
          # the images are built locally, there is no registry to pull them from
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
            - containerPort: 9492
          env:
            - name: ORDER_HOST
              value: "order-service"
            - name: ORDER_PORT
              value: "8090"
            - name: DRONE_HOST
              value: "drone-service"
            - name: DRONE_PORT
              value: "8092"
            - name: EV_CHANNELS_LOCATION
              value: "broker:9092"
          # liveness kills and replaces, readiness only takes the pod out of the Service:
          # a service that is starting has yet to subscribe to its channels
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: shipping-on-the-air
  labels:
    app: api-gateway
spec:
  selector:
    app: api-gateway
  ports:
    - name: api
      port: 8080
    - name: metrics
      port: 9492
  type: ClusterIP
---
# A headless Service has no address of its own: its DNS name resolves to the addresses of
# all the pods behind it. It exists only so that Prometheus can reach every replica.
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-metrics
  namespace: shipping-on-the-air
  labels:
    app: api-gateway
spec:
  clusterIP: None
  selector:
    app: api-gateway
  ports:
    - name: metrics
      port: 9492
