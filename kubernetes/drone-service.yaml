# -----------------------------------------
# Drone Service
# -----------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: drone-service-deployment
  namespace: shipping-on-the-air
  labels:
    app: drone-service
spec:
  # one replica: the services keep their state in memory, so two of them would hold
  # two different truths. See the known limits in the report.
  replicas: 1
  selector:
    matchLabels:
      app: drone-service
  template:
    metadata:
      labels:
        app: drone-service
    spec:
      containers:
        - name: drone-service
          image: shipping-drone-service
          # the images are built locally, there is no registry to pull them from
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8092
            - containerPort: 9493
          env:
            - name: DELIVERY_HOST
              value: "delivery-service"
            - name: DELIVERY_PORT
              value: "8091"
            - name: EV_CHANNELS_LOCATION
              value: "broker:9092"
          # liveness kills and replaces, readiness only takes the pod out of the Service:
          # a service that is starting has yet to subscribe to its channels
          livenessProbe:
            httpGet:
              path: /health
              port: 8092
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /health
              port: 8092
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: drone-service
  namespace: shipping-on-the-air
  labels:
    app: drone-service
spec:
  selector:
    app: drone-service
  ports:
    - name: api
      port: 8092
    - name: metrics
      port: 9493
  type: ClusterIP
