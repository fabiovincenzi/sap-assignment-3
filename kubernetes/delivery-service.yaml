# -----------------------------------------
# Delivery Service
# -----------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: delivery-service-deployment
  namespace: shipping-on-the-air
  labels:
    app: delivery-service
spec:
  # one replica: the services keep their state in memory, so two of them would hold
  # two different truths. See the known limits in the report.
  replicas: 1
  selector:
    matchLabels:
      app: delivery-service
  template:
    metadata:
      labels:
        app: delivery-service
    spec:
      containers:
        - name: delivery-service
          image: shipping-delivery-service
          # the images are built locally, there is no registry to pull them from
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8091
            - containerPort: 9491
          env:
            # the only address it needs: it reaches nobody directly, it publishes and listens
            - name: EV_CHANNELS_LOCATION
              value: "broker:9092"
          # liveness kills and replaces, readiness only takes the pod out of the Service:
          # a service that is starting has yet to subscribe to its channels
          livenessProbe:
            httpGet:
              path: /health
              port: 8091
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /health
              port: 8091
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: delivery-service
  namespace: shipping-on-the-air
  labels:
    app: delivery-service
spec:
  selector:
    app: delivery-service
  ports:
    - name: api
      port: 8091
    - name: metrics
      port: 9491
  type: ClusterIP
