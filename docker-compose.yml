name: shipping-on-the-air

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: zookeeper-01
    networks:
      - shipping_network
    expose:
      - 2181
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    restart: unless-stopped

  broker:
    image: confluentinc/cp-kafka:7.5.3
    container_name: broker-01
    networks:
      - shipping_network
    ports:
      # only the host listener is published: services reach the broker on the internal one
      - "29092:29092"
    expose:
      - 9092
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # two listeners: broker:9092 for the containers, localhost:29092 for the host
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # a single broker cannot replicate its internal topics
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # no artificial wait before a consumer group settles, which keeps the tests quick
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    depends_on:
      - zookeeper
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "broker:9092"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  order-service:
    image: shipping-order-service
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: order-01
    networks:
      - shipping_network
    ports:
      - "8090:8090"
      - "9490:9490"
    expose:
      - 8090
      - 9490
    environment:
      - EV_CHANNELS_LOCATION=broker:9092
    depends_on:
      broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8090/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  delivery-service:
    image: shipping-delivery-service
    build:
      context: .
      dockerfile: delivery-service/Dockerfile
    container_name: delivery-01
    networks:
      - shipping_network
    ports:
      - "8091:8091"
      - "9491:9491"
    expose:
      - 8091
      - 9491
    environment:
      - EV_CHANNELS_LOCATION=broker:9092
    depends_on:
      broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8091/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  drone-service:
    image: shipping-drone-service
    build:
      context: .
      dockerfile: drone-service/Dockerfile
    container_name: drone-01
    networks:
      - shipping_network
    ports:
      - "8092:8092"
      - "9493:9493"
    expose:
      - 8092
      - 9493
    environment:
      - EV_CHANNELS_LOCATION=broker:9092
    depends_on:
      broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8092/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  api-gateway:
    image: shipping-api-gateway
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: gateway-01
    networks:
      - shipping_network
    ports:
      - "8080:8080"
      - "9492:9492"
    expose:
      - 8080
      - 9492
    environment:
      - ORDER_HOST=order-service
      - ORDER_PORT=8090
      - DRONE_HOST=drone-service
      - DRONE_PORT=8092
      - EV_CHANNELS_LOCATION=broker:9092
    depends_on:
      broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus
    container_name: prometheus-01
    volumes:
      - "./prometheus.yml:/etc/prometheus/prometheus.yml"
    networks:
      - shipping_network
    ports:
      - "9090:9090"
    expose:
      - 9090
    restart: unless-stopped

networks:
  shipping_network:
